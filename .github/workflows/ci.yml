name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest supported version (stock macOS python3); newer runner images no longer ship it.
          - {python: "3.9", os: ubuntu-22.04}
          - {python: "3.12", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install pyyaml
      - name: Shared lib copies in sync
        run: make check
      - name: Secret scan
        run: python3 scripts/leak_scan.py --secrets-only
      - name: Tests
        run: make test
