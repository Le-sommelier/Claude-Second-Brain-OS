name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install pyyaml
      - name: Shared lib copies in sync
        run: make check
      - name: Secret scan
        run: python3 scripts/leak_scan.py --secrets-only
      - name: Tests
        run: make test
